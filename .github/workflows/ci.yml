name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check, build, sanitize, classes, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          # Single Node version across local (`.nvmrc`), CI here, and Cloudflare Pages, whose
          # v22 build image defaults to 22.23.4. Workers is not Node - it is V8/workerd - so the
          # binding constraint is the build toolchain: Astro 7.4.4 refuses anything below 22.23.4,
          # and Pages' older v20 image defaults to 18.17.1, which failed the 2026-10-29 build.
          node-version: '22.23.4'
          cache: npm
      # `allowScripts` in package.json is npm 11's install-script allowlist; it gates local
      # installs. Pages/CI run npm 10.9.9, which has no such gate, so the guard there is that
      # `npm ci` installs exactly what the lockfile pins and nothing else.
      - run: npm ci
      # One aggregate script (`npm run verify`) so CI, the Pages build command and a local run
      # execute the identical gate set - no drift between the three:
      #   check (astro check) · check:classes (every class in src/ resolves to CSS - two typos
      #   shipped for years because nothing else could see them) · db:check (schema and
      #   migrations agree, via drizzle.config.check.ts: no credentials, no database opened) ·
      #   check:sanitize (summary rendering stays text-only) · check:cache (summary-cache rules
      #   against a fake KV namespace; one outbound Discord call with a deliberately invalid
      #   token, needs network but no secrets) · audit:gate (prod-only audit with an explicit
      #   allowlist, so a new real advisory fails instead of drowning in known noise) · build.
      # Deliberately excluded: check:discord and check:ai - both need credentials and check:ai
      # spends a paid model call, so they belong in a pre-deploy ritual, not in every build.
      - run: npm run verify
