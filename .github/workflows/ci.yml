name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check, build, sanitize, classes, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          # Single Node version across local (`.nvmrc`), CI here, and Cloudflare Pages, whose
          # v22 build image defaults to 22.23.4. Workers is not Node - it is V8/workerd - so the
          # binding constraint is the build toolchain: Astro 7.4.4 refuses anything below 22.23.4,
          # and Pages' older v20 image defaults to 18.17.1, which failed the 2026-10-29 build.
          node-version: '22.23.4'
          cache: npm
      # `allowScripts` in package.json is npm 11's install-script allowlist; it gates local
      # installs. Pages/CI run npm 10.9.9, which has no such gate, so the guard there is that
      # `npm ci` installs exactly what the lockfile pins and nothing else.
      - run: npm ci
      - run: npm run check
      # Every class written in src/ must resolve to CSS. Two typos (`focus:shadow-outline-blue`,
      # `md:max-w-1xl`) shipped for years because no other tool in the loop could see them.
      - run: npm run check:classes
      # src/schema.ts and migrations/ must agree. Runs against drizzle.config.check.ts, which
      # carries no credentials and opens no database, so it needs neither .wrangler state nor a
      # Cloudflare token.
      - run: npm run db:check
      - run: npm run build
      - run: npm run check:sanitize
      # Summary-cache rules against a fake KV namespace: no credentials and no Claude
      # calls. It does make one outbound Discord call with a deliberately invalid token
      # (the total-failure case), so it needs network but no secrets.
      - run: npm run check:cache
      # Prod-only audit with an explicit allowlist (scripts/audit-gate.ts), so a new real
      # advisory fails the build instead of being lost in a wall of known noise.
      - run: npm run audit:gate
