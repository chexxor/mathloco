# wrangler.toml
# Wrangler v4 removed the top-level `node_compat` key. Node APIs (used by
# @anthropic-ai/sdk and @discordjs/rest) now come from the `nodejs_compat`
# compatibility flag, which requires a compatibility_date.
compatibility_date = "2026-10-29"
compatibility_flags = ["nodejs_compat"]

#[vars]
# Environment variables will be set in the Cloudflare dashboard
# DISCORD_TOKEN = ""
# DISCORD_GUILD_ID = ""
# CLAUDE_API_KEY = ""

[observability]
enabled = true
head_sampling_rate = 1 # optional. default = 1.

[[d1_databases]]
binding = "DB"
database_name = "d1-mathloco-prod-db"
database_id = "4e997466-3b31-4a4d-8187-a1e24f6ab7a3"
preview_database_id = "DB"

# Cross-isolate cache for the Discord summaries (src/lib/discord.ts). The code works
# without it - it falls back to a per-isolate cache and re-pays Discord + Claude on every
# cold start - so this stays commented until the namespaces exist. To enable:
#   npm run cf:kv:create        # prints an `id`; repeat for a preview namespace if wanted
# then paste the ids below and uncomment both blocks, and run `npm run cf:types`.
# [[kv_namespaces]]
# binding = "SUMMARY_CACHE"
# id = "<namespace id from `npm run cf:kv:create`>"
# preview_id = "<preview namespace id>"

[env.preview]
name = "preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "d1-mathloco-preview-db"
database_id = "b58d56c1-6aa6-4108-a1c3-91b5e9dbbcb7"
