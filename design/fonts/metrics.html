<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>face metrics</title>
<style>
  /* Every candidate is loaded from a real woff2 file - the same files a self-hosted build would ship.
     Downloaded from the @fontsource CDN into .design/fonts/ (no package install, so package.json stays clean). */
  @font-face { font-family:"PT Serif"; font-weight:400; src:url("pt-serif-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"PT Serif"; font-weight:700; src:url("pt-serif-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family:"PT Sans"; font-weight:400; src:url("pt-sans-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"PT Sans"; font-weight:700; src:url("pt-sans-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family:"Public Sans"; font-weight:400; src:url("public-sans-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"Public Sans"; font-weight:700; src:url("public-sans-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family:"Source Sans 3"; font-weight:400; src:url("source-sans-3-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"Source Sans 3"; font-weight:700; src:url("source-sans-3-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family:"IBM Plex Sans"; font-weight:400; src:url("ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"IBM Plex Sans"; font-weight:700; src:url("ibm-plex-sans-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family:"Inter"; font-weight:400; src:url("inter-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"Inter"; font-weight:700; src:url("inter-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family:"PT Mono"; font-weight:400; src:url("pt-mono-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"IBM Plex Mono"; font-weight:400; src:url("ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"JetBrains Mono"; font-weight:400; src:url("jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"Space Mono"; font-weight:400; src:url("space-mono-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"PT Sans Narrow"; font-weight:400; src:url("pt-sans-narrow-latin-400-normal.woff2") format("woff2"); }
  body { margin:0; }
  .probe { position:absolute; left:-9999px; top:0; white-space:pre; }
</style>
</head>
<body>
<p>Open with page-measure.mjs - this page has no visible content on purpose.</p>
</body>
</html>
